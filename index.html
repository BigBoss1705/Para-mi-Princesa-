<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Para mi amor 💖</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #ffd6e7, #ffeef5, #ffd9e8);
            color: #5a2940;
            text-align: center;
        }

        .contenedor {
            max-width: 1000px;
            margin: auto;
            padding: 40px 20px;
        }

        h1 {
            font-size: 45px;
            margin-bottom: 10px;
            color: #c2185b;
        }

        .mensaje {
            font-size: 20px;
            line-height: 1.6;
            margin: 20px auto 40px;
            max-width: 700px;
        }

        .corazon {
            font-size: 35px;
            margin-bottom: 10px;
        }

        .galeria {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }

        .foto {
            background-color: white;
            padding: 10px;
            border-radius: 18px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.15);
            transition: transform 0.3s;
        }

        .foto:hover {
            transform: scale(1.04);
        }

        .foto img {
            width: 100%;
            height: 280px;
            object-fit: cover;
            border-radius: 12px;
        }

        .pie {
            margin-top: 40px;
            font-size: 18px;
            color: #8e3a5c;
        }

    </style>

</head>

<body>

    <div class="contenedor">

        <div class="corazon">💖</div>

        <h1>Para mi Princesa Hermosa</h1>

        <p class="mensaje">

            Quise hacer este pequeño espacio para guardar algunos
            de nuestros momentos juntos. 💖

            <br>

            Gracias por cada momento, cada sonrisa y cada recuerdo.

        </p>


        <!-- GALERÍA DE FOTOS -->

        <div class="galeria">


            <!-- FOTO 1 -->

            <div class="foto">

                <img src="Foto1.jpeg" alt="Recuerdos 1">

            </div>


            <!-- FOTO 2 -->

            <div class="foto">

                <img src="Foto2.jpeg" alt="Recuerdos 2">

            </div>


            <!-- FOTO 3 -->

            <div class="foto">

                <img src="Foto3.jpeg" alt="Nuestra Mejor Foto">

            </div>


            <!-- FOTO 4 -->

            <div class="foto">

                <img src="Foto4.jpeg" alt="Cuando te pedi ser mi Novia">

            </div>


        </div>


        <p class="pie">

            Te amo muchimo Mi Princesa 💖.

        </p>

    </div>

</body>

</html>
